name: Publish Telegram Bot

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.3.3). Leave empty to use package.json version."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/telegram
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Set version (if provided)
        if: inputs.version
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Resolve workspace dependencies
        run: |
          SDK_VERSION=$(jq -r '.version' ../sdk/js/package.json)
          jq --arg v "^${SDK_VERSION}" '.dependencies["@opencode-ai/sdk"] = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Publish to npm
        run: npm publish --provenance --access public
